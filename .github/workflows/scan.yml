name: scan

on:
  schedule:
    - cron: "30 1 * * 1" # Monday 01:30 UTC (07:00 IST)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt

      - name: Collect and select
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          WEEK=$(date -u +%G-W%V)
          echo "WEEK=$WEEK" >> "$GITHUB_ENV"
          python scripts/scan.py --week "$WEEK"
          python scripts/select.py --week "$WEEK"

      - name: Commit scan
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "scan: $WEEK"
          # main can move while the scan runs (a merged PR), and a plain push
          # would then be rejected and the week's scan lost. Rebase and retry.
          for attempt in 1 2 3; do
            if git pull --rebase origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME"; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            echo "rebase or push failed (attempt $attempt of 3); trying again"
            sleep $((attempt * 5))
          done
          echo "could not push the scan after 3 attempts" >&2
          exit 1
